<div class="row">
  <div class="col-sm-12">
    <div class="card p-1 pb-0 mb-1">
      <div class="card-header p-3 m-0">
        <div class="row">
          <div class="col-sm-6">
            <h5><i class="ti ti-report-analytics"></i>&nbsp; Generate Report</h5>
          </div>
          <div class="col-sm-6 align-right">
            <div class="btn-group-sm">
              <button class="btn btn-default dropdown-toggle" type="button" data-bs-toggle="dropdown"
                      aria-expanded="false" title="Export to File">
                <i class="ti ti-menu-2"></i>
              </button>
              <ul class="dropdown-menu ">
                <li><a class="dropdown-item" href="javascript:" (click)="exportToPdf()">Export To PDF</a></li>
                <li><a class="dropdown-item" href="javascript:" (click)="exportToExcel()">Export To Excel</a></li>
                <li><a class="dropdown-item" href="javascript:" (click)="exportToCsv()">Export To CSV</a></li>
                <li>
                  <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item" href="javascript:" (click)="printReport()"> Print</a></li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div class="col-md-3">
    <div class="card p-1">
      <form class="form" [formGroup]="reportForm" (ngSubmit)="buttonClicked()">
        <div class="card-header p-1">
          <div class="form-group mb-0">
            <label for="selectedReportType" class="form-label">Report Type:</label>
            <select class="form-select" formControlName="selectedReportType" id="selectedReportType"
                    name="selectedReportType" (change)="reportTypeChangeHandler(reportType.value)">
              <option value="" selected>--- Select Report Type ---</option>
              <option *ngFor="let type of reportTypes" [value]="type.id">{{ type.title }}</option>
            </select>
          </div>
        </div>
        <div class="card-body p-0" style="height: calc(52vh); overflow-y: auto">

          <div class="form-group mb-0" *ngIf="reportIsTypeOf(summerizedReports)">
            <label for="summerizedBy" class="form-label">Summerized By:</label>
            <select class="form-select" formControlName="summerizedBy" name="summerizedBy">
              <option value="1" selected>Region</option>
              <option value="2">Zone</option>
              <option value="3">Woreda</option>
            </select>
          </div>

          <div class="form-group mb-0" *ngIf="reportIsTypeOf(filterReports)">
            <label for="filteredBy" class="form-label">Filtered By:</label>
            <select class="form-select" formControlName="filteredBy" name="filteredBy" id="filteredBy">
              <option value="0" selected>None</option>
              <option value="1">Region</option>
              <option value="2">Zone</option>
              <option value="3">Woreda</option>
            </select>
          </div>

          <div class="form-group mb-0" *ngIf="isFilteredBy([1,2,3]) && reportIsTypeOf(filterReports)">
            <label for="region" class="form-label">Region:</label>
            <select #regionSelect class="form-select" formControlName="region" name="region"
                    (change)="regionSelected(regionSelect.value)">
              <option value="" selected>--- Select Region ---</option>
              <option *ngFor="let type of regions" [value]="type.csaregionid">{{ type.csaregionnameeng }}</option>
            </select>
          </div>

          <div class="form-group mb-0" *ngIf="isFilteredBy([2,3]) && reportIsTypeOf(filterReports)">
            <label for="region" class="form-label">Zone:</label>
            <select #zoneSelect class="form-select" formControlName="zone" name="zone"
                    (change)="zoneSelected(zoneSelect.value)">
              <option value="" selected>--- Select Zone ---</option>
              <option *ngFor="let type of zoneList" [value]="type.nrlaisZoneid">{{ type.csazonenameeng }}</option>
            </select>
          </div>

          <div class="form-group mb-0" *ngIf="isFilteredBy([3]) && reportIsTypeOf(filterReports)">
            <label for="woreda" class="form-label">Woreda:</label>
            <select class="form-select" formControlName="woreda" name="woreda">
              <option value="" selected>--- Select Woreda ---</option>
              <option *ngFor="let type of woredaList" [value]="type.nrlaisWoredaid">{{ type.woredanameeng }}</option>
            </select>
          </div>

          <div class="form-group mb-0" *ngIf="reportIsTypeOf([5])">
            <div formArrayName="dates">
              <div *ngFor="let language of reportForm.controls['dates']['controls']; let i=index">
                <div [formGroupName]="i">
                  <div class="input-group mb-0">
                       <span class="input-group-text">
                          <i class="ti ti-calendar"></i>
                        </span>
                    <input type="date" required class="form-control" formControlName="date">
                    <button class="btn btn-outline-light" *ngIf="reportForm.controls['dates']['controls'].length > 1"
                            (click)="removeDate(i)"><i class="ti ti-minus"></i></button>
                  </div>
                </div>
              </div>
            </div>
          </div>

          <div class="form-group mb-0" *ngIf="reportIsTypeOf([6])">
            <div formArrayName="farmSizes">
              <div *ngFor="let language of reportForm.controls['farmSizes']['controls']; let i=index" class="">
                <div class="" [formGroupName]="i">
                  <div class="form-group mb-0">
                    <label>Size</label>
                    <div class="input-group">
                      <input type="text" required class="form-control" formControlName="size">
                      <button *ngIf="reportForm.controls['farmSizes']['controls'].length > 1"
                              class="btn btn-outline-light"
                              (click)="removeSizeField(i)"><i class="ti ti-minus"></i></button>
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="form-group mb-0">
              <button class="w-100 btn btn-success btn-sm" (click)="addSizeField()"> Add Size</button>
            </div>
          </div>

          <div class="form-group mb-0" *ngIf="reportIsTypeOf([10])">
            <label for="toDate" class="form-label">To Date:</label>
            <input class="form-control" type="date" formControlName="endDate" placeholder="Select Date">
          </div>

          <div class="form-group mb-0" *ngIf="reportIsTypeOf([11])">
            <label for="fromYear" class="form-label">From Year: </label>
            <select class="form-select" formControlName="startYear"
                    placeholder="Start Year">
              <option value="2017">2017</option>
              <option value="2018">2018</option>
              <option value="2019">2019</option>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
            </select>
          </div>

          <div class="form-group mb-0" *ngIf="reportIsTypeOf([11])">
            <label for="endYear" class="form-label">To Year: </label>
            <select class="form-select" formControlName="endYear"
                    placeholder="End Year">
              <option value="2017">2017</option>
              <option value="2018">2018</option>
              <option value="2019">2019</option>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
              <option value="2024">2024</option>
              <option value="2025">2025</option>
            </select>
          </div>
          <div class="form-group mb-0" *ngIf="reportIsTypeOf([11])">
            <label for="farmId" class="form-label">Farm:</label>
            <select class="form-select" formControlName="farmId" id="farmId" name="farmId">
              <option value="0">--- Select Farm ---</option>
              <option *ngFor="let type of farms" [value]="type.id">{{ type.operator.name }}</option>
            </select>
          </div>

        </div>
      </form>
      <div class="card-footer p-2">
        <button class="btn btn-custom w-100" (click)="buttonClicked()">Generate</button>
      </div>
    </div>
  </div>
  <div class="col-md-9">
    <div class="card p-1">
      <div class="card-body p-0" style="height: calc(70vh); overflow-y: auto">
        <div id="report_html" [innerHtml]="html"></div>
      </div>
    </div>
  </div>
</div>
