<div class="row">
  <div class="col-sm-12">
    <div class="card">
      <div class="card-header">
        <div class="row">
          <div class="col-md-4">
            <h5><i class="ti ti-device-desktop-analytics"></i>&nbsp;&nbsp;User Activity Log</h5>
          </div>
        </div>
      </div>
      <div class="card-body" style="min-height: calc(65vh)">
        <div class="table-responsive">
          <table id="datatable" class="table">
            <thead>
            <tr class="headings">
              <th>
                #
              </th>
              <th class="column-title">Full Name</th>
              <th class="column-title">Username</th>
              <th class="column-title">Action Type</th>
              <th class="column-title">Time Stamp</th>
              <th class="align-center"><span class="nobr">Action</span>
              </th>
            </tr>
            </thead>

            <tbody *ngIf="pagedItems?.length>0">
            <tr class="even pointer" *ngFor="let audit of pagedItems;index as i">
              <td class="a-center ">
                {{(pager.currentPage - 1) * pager.pageSize + i + 1}}
              </td>
              <td class=" ">{{ audit.fullName }}</td>
              <td class=" ">{{ audit.userName }}</td>
              <td class=" ">{{audit.action}}</td>
              <td class=" ">{{audit.actionTime}}</td>

              <td class=" last align-right">
                <button type="button" class="btn btn-sm btn-custom-light" (click)="showAuditLog(audit)"><i class="ti ti-eye"></i></button>
              </td>
            </tr>
            </tbody>
            <tbody *ngIf="pagedItems?.length==0">
            <tr>
              <td colspan="6">

                <div class="justify-content-center mt-5 no-data">
                  <i class="ti ti-exclamation-circle"></i>
                  <h4>Sorry!</h4>
                  <p>There is no recored found, please try later</p>
                </div>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
      <div class="card-footer pb-0">
        <div class="justify-content-end">
          <nav aria-label="..." *ngIf="pager.pages && pager.pages.length">
            <ul class="pagination justify-content-end">
              <li class="page-item" [class.disabled]="pager.currentPage === 1">
                <a class="page-link" href="javascript:" tabindex="-1" (click)="setPage(1)"><i class="ti ti-chevron-left-pipe"></i></a>
              </li>
              <li class="page-item" [class.disabled]="pager.currentPage === 1">
                <a class="page-link" href="javascript:" (click)="setPage(pager.currentPage - 1)"><i class="ti ti-chevron-left"></i></a>
              </li>
              <li *ngFor="let page of pager.pages" class="page-item"><a class="page-link"  [class.active]="pager.currentPage === page" href="javascript:" (click)="setPage(page)">{{page}}</a></li>
              <li class="page-item" [class.disabled]="pager.currentPage === pager.totalPages">
                <a class="page-link" href="javascript:" (click)="setPage(pager.currentPage + 1)"><i class="ti ti-chevron-compact-right"></i></a>
              </li>
              <li class="page-item" [class.disabled]="pager.currentPage === pager.totalPages">
                <a class="page-link" href="javascript:" (click)="setPage(pager.totalPages)"><i class="ti ti-chevron-right-pipe"></i></a>
              </li>
            </ul>
          </nav>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="modal fade" [class.show]="showAuditLogModal" [style.display]="showAuditLogModal ? 'block' : 'none'"
     id="resetPassModal" tabindex="-1" aria-labelledby="resetPassModalLabel" aria-hidden="true">
  <div class="modal-dialog "  style="max-width: 65%">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="resetPassModalLabel">
          Audit Log Detail
        </h5>
        <button type="button" class="btn-close" (click)="closeAuditLog()" aria-label="Close"></button>
      </div>
      <div class="modal-body p-0" style="max-height: calc(80vh);">
        <app-auditLog-detail *ngIf="showAuditLogModal" [auditLogItem]="auditDetails" (closeAuditLogDetails)="closeAuditLog()" [headerButton]="false"></app-auditLog-detail>
      </div>
      <div class="modal-footer"></div>
    </div>
  </div>
</div>

<!-- Backdrop -->
<div class="modal-backdrop fade show" *ngIf="showAuditLogModal" (click)="closeAuditLog()"></div>
