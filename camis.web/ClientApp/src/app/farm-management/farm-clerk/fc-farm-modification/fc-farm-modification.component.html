<div class="row">
  <div class="col-sm-12">
    <div class="card p-0">
      <div class="card-header p-2">
        <h5><i class="ti ti-tractor"></i>&nbsp;&nbsp;Edit Commercial Farm</h5>
      </div>
      <div class="card-block p-0" style="min-height: calc(70vh)" id="farm-registration">
        <form method="post" (submit)="dumpSubmit($event)">
          <div class="card m-0" [id]="'farm-reg-panel'" *ngIf="step == 1">
            <div class="card-header p-3">
              <h5>Step 1 of 2: Edit Farm Owner</h5>
            </div>
            <div class="card-body">
                <div class="row">
                  <div class="col-md-7">
                    <div class="row">
                      <div class="col-md-6">
                        <div class="form-group">
                          <label class="control-label" for="op-type">Owner Type:<span class="text-danger">(*)&nbsp;</span>
                            <span *ngIf="!opType" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                          <select [(ngModel)]="opType" name="op-type" id="op-type" class="form-select" required>
                            <option *ngFor="let type of farmOperatorTypes" [value]="type.id">{{ type.name }}</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="form-group">
                          <label class="control-label" for="op-name">Owner Name:<span class="text-danger">(*)&nbsp;</span>
                            <span *ngIf="!opName" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span>
                          </label>
                          <input [(ngModel)]="opName" type="text" name="op-name" id="op-name" class="form-control" required>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="form-group">
                          <label class="control-label" for="op-origin">Owner Origin:<span class="text-danger">(*)&nbsp;</span>
                            <span *ngIf="!opOriginId" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                          <select [(ngModel)]="opOriginId" name="op-origin" id="op-origin" class="form-select" required>
                            <option *ngFor="let origin of farmOperatorOrigins" [value]="origin.id">{{ origin.name }}</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="form-group">
                          <label class="control-label"
                                 for="op-nationality">{{ opType == '1' ? 'Nationality' : 'Country of Origin' }}:<span class="text-danger">(*)&nbsp;</span>
                            <span *ngIf="!opNationality" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                          <input [(ngModel)]="opNationality" type="text" name="op-nationality" id="op-nationality"
                                 class="form-control" required>
                        </div>
                      </div>
                      <div class="col-md-6" *ngIf="opType == '1'">
                        <div class="form-group">
                          <label class="control-label" for="op-gender">Gender:<span class="text-danger">(*)&nbsp;</span>
                            <span *ngIf="!opGender" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                          <select [(ngModel)]="opGender" name="op-gender" id="op-gender" class="form-select" required>
                            <option value="F">Female</option>
                            <option value="M">Male</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-md-6" *ngIf="opType == '1'">
                        <div class="form-group">
                          <label class="control-label" for="op-martial-status">Martial Status:<span class="text-danger">&nbsp;*&nbsp;</span>
                            <span *ngIf="!opMartialStatus" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                          <select [(ngModel)]="opMartialStatus" name="op-martial-status" id="op-martial-status"
                                  class="form-select" required>
                            <option [value]="1">Not Married</option>
                            <option [value]="2">Married</option>
                            <option [value]="3">Divorced</option>
                            <option [value]="4">Widowed</option>
                          </select>
                        </div>
                      </div>
                      <div class="col-md-6" *ngIf="opType == '1'">
                        <div class="form-group">
                          <label class="control-label" for="op-birthdate">Date of Birth:<span class="text-danger">(*)&nbsp;</span>
                            <span *ngIf="!opBirthdate" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                          <input [(ngModel)]="opBirthdate" type="date" name="op-birthdate" id="op-birthdate" class="form-control"
                                 required>
                        </div>
                      </div>
                      <div class="col-md-6" *ngIf="opType == '6'">
                        <div class="form-group">
                          <label class="control-label" for="op-venture-search">Ventures:<span class="text-danger">(*)&nbsp;</span>
                            <span *ngIf="!opVentures" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                          <div *ngIf="opVentures.length">
                            <p><small class="text-muted">{{ opVentures.length }} Selected Venture:</small></p>
                            <div *ngFor="let farmOperatorId of opVentures; index as i" class="btn-group me-2"
                                 style="zoom:75%">
                              <a
                                [href]="'farm-management/fc/farm-operator/' + farmOperatorId"
                                target="_blank"
                                rel="noopener"
                                class="btn btn-sm btn-secondary">Owner {{ i + 1 }} </a>

                              <button type="button" (click)="removeFromVentures(farmOperatorId)"
                                      class="btn btn-sm btn-outline-warning">
                                <i class="ti ti-trash"></i>
                              </button>
                            </div>
                          </div>
                          <div class="panel panel-body panel-default" style="margin-top: 5px">
                            <input
                              (keyup)="searchVentures($any($event.target).value)"
                              (change)="searchVentures($any($event.target).value)"
                              (blur)="searchVentures($any($event.target).value)"
                              type="search"
                              name="op-venture-search"
                              id="op-venture-search"
                              class="form-control"
                              style="flex-grow: 1"
                              placeholder="Search"
                            >
                            <div style="padding-top: 5px">
                              <select
                                [(ngModel)]="opVentureResultSelections"
                                type="search"
                                name="op-venture-results"
                                id="op-venture-results"
                                class="form-select"
                                multiple
                              >
                                <option *ngFor="let result of opVentureResults" [value]="result.id">{{ result.name }}
                                </option>
                              </select>
                              <div style="text-align: right; padding-top: 5px">
                                <button type="button" (click)="addVentures()" class="btn btn-primary btn-sm"
                                        style="margin-right: 0">
                                  Add Selected
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>

                      <div class="col-md-6">
                        <div class="form-group">
                          <label class="control-label" for="op-capital">Capital:<span class="text-danger">(*)&nbsp;</span>
                            <span *ngIf="!opCapital" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                          <input [(ngModel)]="opCapital" type="number" name="op-capital" id="op-capital" class="form-control" placeholder="Enter initial capital">
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="form-group">
                          <label class="control-label" for="op-phone">Phone:<span class="text-danger">(*)&nbsp;</span>
                            <span *ngIf="!opPhone" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                          <input [(ngModel)]="opPhone" type="tel" name="op-phone" id="op-phone" class="form-control" required placeholder="Enter valid mobile no">
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="form-group">
                          <label class="control-label" for="op-email">Email:&nbsp;
                            <span *ngIf="!validEmail" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            Enter valid email address
                          </span></label>
                          <input [(ngModel)]="opEmail" type="email" name="op-email" id="op-email" class="form-control" placeholder="Enter email address" (keyup)="validateEmail()">
                        </div>

                      </div>
                    </div>
                  </div>
                  <div class="col-md-3">

                    <div class="form-group">
                      <label class="control-label" *ngIf="!opAddress">
                        Address:<span class="text-danger">(*)&nbsp;</span>
                        <span *ngIf="!opAddress" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            Address field is required
                          </span>
                      </label>
                      <app-address-selector [finalAddressId]="opAddress"
                                            (onChange)="opAddress = $event"></app-address-selector>
                    </div>
                  </div>
                  <div class="col-md-2">
                    <div class="card p-1">
                      <div class="card-body p-1">
                        <img [src]="getPhotoSource()" style="max-width: 100%; max-height: 300px; object-fit: cover;" class="profile-image">
                      </div>
                      <div class="card-footer p-1">
                        <input type="file" id="opPhoto" name="opPhoto" style="display: none"
                               (change)="readPhotoFile($event)" accept="image/*">
                        <button type="button" class="btn btn-success btn-sm w-100" (click)="changePhoto()">Upload Profile</button>
                      </div>
                    </div>
                  </div>
                  <div class="col-md-12">
                    <app-authority-registrar
                      title="Supporting/License/Registration Documents"
                      [registrations]="opRegistrations"
                      [registrationTypes]="registrationTypes"
                      [registrationAuthorities]="registrationAuthorities"
                      (change)="$event.registrations && (opRegistrations = $event.registrations)"
                    ></app-authority-registrar>
                  </div>
                </div>
            </div>
            <div class="card-footer p-2">
              <div class="row">
                <div class="col-md-6 justify-content-start">
                  <button type="button" class="btn btn-warning" (click)="cancel()"> Cancel </button>
                </div>
                <div class="col-md-6 align-right">
                  <button type="button" class="btn btn-primary" (click)="step = 2"
                          [disabled]="(!opName || !opNationality || !opType || !opAddress || !opCapital || !opPhone || ((opType==='1' && (!opGender || !opMartialStatus || !opBirthdate)) || (opType==='6' && !opVentures)) || !validEmail)">
                    Next
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="card m-0" [id]="'farm-reg-panel'" *ngIf="step == 2">
            <div class="card-header p-3">
              <h5>Step 2 of 2: Edit Farm Info</h5>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="control-label" for="fr-type">Primary Farm Type:<span class="text-danger">(*)&nbsp;</span>
                      <span *ngIf="!opVentures" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                    <select [(ngModel)]="frType" name="fr-type" id="fr-type" class="form-select" required>
                      <option *ngFor="let type of farmTypes" [value]="type.id">{{ type.name }}</option>
                    </select>
                  </div>
                  <div class="form-group">
                    <label class="control-label" for="fr-other-types">Other Farm Types:</label>
                    <select [(ngModel)]="frOtherTypeIds" name="fr-other-types" id="fr-other-types" class="form-select"
                            multiple>
                      <option *ngFor="let type of farmTypes" [value]="type.id">
                        {{ type.name }}
                      </option>
                    </select>
                  </div>
                </div>
                <div class="col-md-6">
                  <div class="form-group">
                    <label class="control-label" for="fr-invested-capital">Invested Capital:<span class="text-danger">(*)&nbsp;</span>
                      <span *ngIf="!frInvestedCapital" class="error-message">
                            <i class="ti ti-exclamation-circle me-1"></i>
                            This field is required
                          </span></label>
                    <input [(ngModel)]="frInvestedCapital" type="number" name="fr-invested-capital" id="fr-invested-capital"
                           class="form-control" required placeholder="Enter invested capital">
                  </div>
                  <div class="form-group">
                    <label class="control-label" for="fr-description">Description: </label>
                    <textarea [(ngModel)]="frDescription" type="number" name="fr-description" id="fr-description"
                              class="form-control"></textarea>
                  </div>
                </div>

                <div class="col-md-12">
                  <app-authority-registrar
                    title="Farm Registrations"
                    [registrations]="frRegistrations"
                    [registrationTypes]="registrationTypes"
                    [registrationAuthorities]="registrationAuthorities"
                    (change)="$event.registrations && (frRegistrations = $event.registrations)"
                  ></app-authority-registrar>
                </div>
              </div>
            </div>
            <div class="card-footer p-2">
              <div class="row">
                <div class="col-md-6 justify-content-start">
                  <button type="button" class="btn btn-secondary" (click)="step = 1">
                    Back
                  </button>
                </div>
                <div class="col-md-6 align-right">
                  <button (click)="onSubmit($event)" type="button" class="btn btn-primary" [disabled]="!frType">
                    Submit for Approval
                  </button>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
