<div class="row">
  <div class="col-sm-12">
    <div class="card p-0">
      <div class="card-header p-2">
        <div class="row">
          <div class="col-md-6">
            <h5><i class="ti ti-tractor"></i>Reviewing Farm Registration</h5>
          </div>
          <div class="col-md-6 align-right">
            <div class="btn-group" *ngIf="data">
              <button class="btn btn-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown"
                      aria-expanded="false">
                Actions
              </button>
              <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="javascript:" (click)="onReject()"> Reject Request</a></li>
                <li>
                  <hr class="dropdown-divider">
                </li>
                <li><a class="dropdown-item" href="javascript:" (click)="onApprove()">Approve Registration</a></li>
              </ul>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
  <div *ngIf="data">
    <app-farm-detail *ngIf="data" [farm]="data"></app-farm-detail>
  </div>
</div>
