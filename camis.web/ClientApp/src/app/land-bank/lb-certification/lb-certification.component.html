
<div class="row">
  <div class="col-sm-12">
    <div class="card p-0">
      <div class="card-header p-2">
        <div class="row">
          <div class="col-md-6">
            <h4><i class="ti ti-map-plus"></i> &nbsp;&nbsp;Commercial Farm & Investment Details</h4>
          </div>
          <div class="col-md-6 " style="text-align: right">
            <div class="btn-group" *ngIf="!loading && data">
              <button type="button" class="btn btn-custom"  data-bs-toggle="modal" data-bs-target="#add-certification-document-dialog">
                {{certification.doc ? 'Change Certification Document *' : 'Select Certification Document *'}}
              </button>
              <button  type="button" class="btn btn-custom-light" data-bs-toggle="modal" data-bs-target="#add-lease-document-dialog">
                {{leaseContract.doc ? 'Change Lease Document *' : 'Select Lease Document *'}}
              </button>
              <button class="btn btn-custom" type="button" (click)="onCertify()" [disabled]="!certification.doc || !leaseContract.doc">
                Certify Location
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="!loading && data">
    <app-farm-detail *ngIf="data" [farm]="data"></app-farm-detail>
  </div>
</div>

<div id="add-certification-document-dialog" class="modal fade" tabindex="-1" aria-labelledby="add-certification-document-dialogLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="add-certification-document-dialogLabel">  {{certification.doc ? 'Change Certification Document' : 'Select Certification Document'}}</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <app-single-document-selector
          title="Choose a Document"
          [document]="certification.doc"
          (change)="chooseCertificationDocument($event)"
        ></app-single-document-selector>
      </div>
      <div class="modal-footer right">
        <button type="button" class="btn btn-warning" (click)="clear()" data-bs-dismiss="modal" aria-label="Close">Cancel</button>
        <button type="button" class="btn btn-success" data-bs-dismiss="modal" aria-label="Close">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="add-lease-document-dialog" class="modal fade" tabindex="-1" aria-labelledby="add-lease-document-dialogLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h4 class="modal-title" id="add-lease-document-dialogLabel">  {{leaseContract.doc ? 'Change Lease Document' : 'Select Lease Document'}}</h4>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <app-single-document-selector
          title="Choose a Document"
          [document]="leaseContract.doc"
          (change)="chooseLeaseContractDocument($event)"
        ></app-single-document-selector>
      </div>
      <div class="modal-footer right">
        <button type="button" class="btn btn-warning" (click)="clear()" data-bs-dismiss="modal" aria-label="Close">Cancel</button>
        <button type="button" class="btn btn-success" data-bs-dismiss="modal" aria-label="Close">Save</button>
      </div>
    </div>
  </div>
</div>
