<div class="row">
  <div class="col-sm-12">
    <div class="card p-0">
      <div class="card-header p-2">
        <div class="row">
          <div class="col-md-6">
            <h5><i class="ti ti-tractor"></i>&nbsp;&nbsp;Commercial Farm & Investment Details</h5>
          </div>
          <div class="col-md-6 " style="text-align: right">
              <a *ngIf="['8', '9', '10'].includes(loginRole || '') && plan" class="btn btn-custom-light"  [href]="urlPrefix + 'Report/PlanForm/' + plan.id"  title="View Printable Paper Form" target="_blank">Paper Form</a>
              <a *ngIf="['8', '9', '10'].includes(loginRole || '') && plan && plan.id"  class="btn btn-custom" href="javascript:" (click)="goToReports(plan.id)">View Progress Reports</a>

          </div>
        </div>

      </div>

    </div>
  </div>
  <div *ngIf="!loading && farm">
    <app-farm-detail *ngIf="farm" [farm]="farm"></app-farm-detail>
  </div>

</div>
