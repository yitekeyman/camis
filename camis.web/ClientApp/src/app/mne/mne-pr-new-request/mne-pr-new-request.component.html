<div class="row">
  <div class="col-sm-12">
    <div class="card p-0">
      <div class="card-header p-2">
        <div class="row">
          <div class="col-md-6">
            <h5><i class="ti ti-tractor"></i>&nbsp;&nbsp;Commercial Farm & Investment Details</h5>
          </div>
          <div class="col-md-6 pc-h-item dropdown" style="text-align: right">
              <button class="btn btn-custom-light me-2" type="button" *ngIf="loginRole==='9' && plan && plan.id"
                      (click)="goToReports(plan.id)">View Progress Reports
              </button>
              <button class="btn btn-custom" type="button" *ngIf="loginRole==='9' && farm && farm.activityId"
                      (click)="requestProgressReport()">Request New Progress Report
              </button>
          </div>
        </div>

      </div>

    </div>
  </div>
  <div *ngIf="!loading && farm">
    <app-farm-detail *ngIf="farm" [farm]="farm"></app-farm-detail>
  </div>

</div>
